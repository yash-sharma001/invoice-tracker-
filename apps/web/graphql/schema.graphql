"""
GraphQL schema — the single contract shared by the mock resolvers, GraphQL
Codegen, and (later) the real Hasura API.

The object types + enums are the brief's data model verbatim. The Query /
Mutation surface, filter/sort inputs, and the *Stats aggregate types are this
app's read model — when the real endpoint is wired these map onto Hasura
queries / views.
"""

type Vendor {
  id: ID!
  name: String!
  taxId: String
  paymentTermsDays: Int
  email: String
  invoices: [Invoice!]!
}

"""A party we bill (accounts receivable). Mirror of Vendor."""
type Customer {
  id: ID!
  name: String!
  """PAN, historically — GST registration itself is `gstin`, not this."""
  taxId: String
  email: String
  paymentTermsDays: Int
  creditLimit: Float
  gstin: String
  address: String
  """Free-text state name — compared against the company's own `state` to
  decide CGST+SGST (same state) vs IGST (different states) on a generated
  GST invoice."""
  state: String
  """Registered legal name, city and pincode — required by the IRP for an
  e-invoice."""
  legalName: String
  city: String
  pincode: String
  invoices: [Invoice!]!
}

enum InvoiceDirection {
  PAYABLE
  RECEIVABLE
}

"""Receivable-only lifecycle (payables use ApprovalStatus instead)."""
enum CollectionStatus {
  DRAFT
  SENT
  DISPUTED
  SETTLED
}

type PurchaseOrder {
  id: ID!
  poNumber: String!
  vendor: Vendor!
  amount: Float!
  department: String!
  status: String!
}

type Invoice {
  id: ID!
  invoiceNumber: String!
  description: String
  """Raw OCR-extracted text this invoice was created from, if any — embedded
  by genai-service alongside the structured fields for richer semantic search."""
  extractedText: String
  direction: InvoiceDirection!
  """Set for payables (null for receivables — use `customer`)."""
  vendor: Vendor
  """Set for receivables (null for payables — use `vendor`)."""
  customer: Customer
  collectionStatus: CollectionStatus
  purchaseOrder: PurchaseOrder
  invoiceDate: String!
  dueDate: String!
  amount: Float!
  taxAmount: Float!
  department: String!
  approvalStatus: ApprovalStatus!
  paymentStatus: PaymentStatus!
  source: String!
  """Which template generateAndSendInvoice used, if it was generated that
  way — null for invoices created by any other path (upload, manual entry,
  CSV). Presence of this is what gates the "Resend" action."""
  template: String
  """The IRP's Invoice Reference Number — set only once the government IRP
  has registered the invoice; an invoice without one isn't a valid e-invoice."""
  irn: String
  """pending | generated | failed | cancelled; null when e-invoicing doesn't
  apply to this invoice."""
  einvoiceStatus: String
  """Why the IRP registration failed, when einvoiceStatus is `failed`."""
  einvoiceError: String
  """Days past the due date for an unpaid invoice; 0 otherwise."""
  daysOverdue: Int!
  duplicateFlag: DuplicateFlag
  delayPrediction: DelayPrediction
  approvalEvents: [ApprovalEvent!]!
  payments: [Payment!]!
}

type DuplicateFlag {
  matchedInvoiceId: ID!
  matchedInvoice: Invoice
  confidenceScore: Float!
  reviewedStatus: String!
  reason: String
  explanation: [FeatureContribution!]!
}

type DelayPrediction {
  delayProbability: Float!
  predictedDelayDays: Int!
  modelVersion: String!
  explanation: [FeatureContribution!]!
}

"""One feature's signed contribution to a single prediction — the
explainable-AI backing for delay risk and duplicate matches, computed from
the model itself (XGBoost pred_contribs), not a hand-written heuristic."""
type FeatureContribution {
  feature: String!
  label: String!
  value: Float!
  contribution: Float!
  direction: String!
}

type Payment {
  id: ID!
  invoice: Invoice!
  paidAt: String
  amountPaid: Float!
}

type ApprovalEvent {
  id: ID!
  actor: String!
  action: String!
  note: String
  at: String!
}

enum ApprovalStatus {
  PENDING
  APPROVED
  REJECTED
}

enum PaymentStatus {
  UNPAID
  PAID
  OVERDUE
}

enum SortDir {
  ASC
  DESC
}

type DashboardStats {
  pendingCount: Int!
  pendingAmount: Float!
  overdueCount: Int!
  overdueAmount: Float!
  vendorExposureTotal: Float!
  # Admin-only block (nullable — only requested when the viewer is admin).
  approvedUnpaidCount: Int
  approvedUnpaidAmount: Float
  paidLast30Count: Int
  paidLast30Amount: Float
  rejectedCount: Int
  avgDaysToPay: Float
}

type VendorStats {
  vendor: Vendor!
  totalInvoices: Int!
  totalExposure: Float!
  avgDelayDays: Float!
  onTimePct: Float!
}

type VendorExposure {
  vendorId: ID!
  vendorName: String!
  outstanding: Float!
}

type CustomerStats {
  customer: Customer!
  totalInvoices: Int!
  totalExposure: Float!
  avgDelayDays: Float!
  onTimePct: Float!
}

type CustomerExposure {
  customerId: ID!
  customerName: String!
  outstanding: Float!
}

"""Accounts-receivable dashboard block (mirror of DashboardStats for money in)."""
type InflowStats {
  outstandingCount: Int!
  outstandingAmount: Float!
  overdueCount: Int!
  overdueAmount: Float!
  draftCount: Int!
  disputedCount: Int!
  settledLast30Count: Int!
  settledLast30Amount: Float!
  avgDaysToCollect: Float
  """Days sales outstanding."""
  dso: Float
}

type CashForecastBucket {
  label: String!
  """Predicted receipts landing in this window (unpaid receivables, due date + predicted delay)."""
  inflow: Float!
  """Predicted payments leaving in this window (unpaid payables, same basis)."""
  outflow: Float!
  net: Float!
}

type CashForecast {
  buckets: [CashForecastBucket!]!
  netTotal: Float!
}

type InvoicePage {
  rows: [Invoice!]!
  total: Int!
  page: Int!
  pageSize: Int!
}

input InvoiceFilter {
  direction: InvoiceDirection
  vendorId: ID
  customerId: ID
  department: String
  dateFrom: String
  dateTo: String
  approvalStatus: ApprovalStatus
  collectionStatus: CollectionStatus
  paymentStatus: PaymentStatus
  source: String
  q: String
}

input InvoiceSort {
  field: String!
  dir: SortDir!
}

input InvoiceInput {
  invoiceNumber: String!
  description: String
  extractedText: String
  """PAYABLE (default) needs vendorId; RECEIVABLE needs customerId."""
  direction: InvoiceDirection
  vendorId: ID
  customerId: ID
  purchaseOrderId: ID
  invoiceDate: String!
  dueDate: String!
  amount: Float!
  taxAmount: Float!
  department: String!
  source: String!
}

type ImportError {
  row: Int!
  message: String!
}

type ImportResult {
  created: Int!
  failed: Int!
  errors: [ImportError!]!
}

type AskAnswer {
  text: String!
  invoices: [Invoice!]!
}

type Query {
  dashboardStats(vendorId: ID): DashboardStats!
  invoices(filter: InvoiceFilter, sort: InvoiceSort, page: Int = 1, pageSize: Int = 25): InvoicePage!
  invoice(id: ID!): Invoice
  invoiceSummary(id: ID!): String!
  vendors: [VendorStats!]!
  vendor(id: ID!): VendorStats
  vendorExposure(vendorId: ID): [VendorExposure!]!
  customers: [CustomerStats!]!
  customer(id: ID!): CustomerStats
  customerExposure(customerId: ID): [CustomerExposure!]!
  inflowStats(customerId: ID): InflowStats!
  cashForecast: CashForecast!
  ask(prompt: String!): AskAnswer!
  companySettings: CompanySettings!
  """Admin only. Whether this company is ready to issue e-invoices."""
  einvoiceSetup: EinvoiceSetup!
  mlModelStatus: MlModelStatus!
  mlDriftStatus: [MlDriftReport!]!
  mlRetrainHistory(limit: Int): [MlRetrainEvent!]!
  reviewQueue(status: String = "pending"): [ReviewQueueItem!]!
  demoRequests(limit: Int): [DemoRequest!]!
}

# Submitted from the public landing page's "Book a demo" form — admin-only,
# not tied to any company (the submitter isn't a signed-up customer yet).
type DemoRequest {
  id: ID!
  companyName: String!
  contactName: String!
  workEmail: String!
  companySize: String
  message: String
  createdAt: String!
}

type CompanySettings {
  name: String!
  aliases: [String!]!
  """Who gets this company's daily overdue-invoice digest."""
  digestEmails: [String!]!
  """Saved default digital signature (a data: URL PNG), stamped on every
  generated invoice from Settings -> Signature. Null until one is saved."""
  signatureDataUrl: String
  """Saved company logo (a data: URL image), printed in the invoice header.
  Null until one is uploaded from Settings -> Logo."""
  logoDataUrl: String
  gstin: String
  pan: String
  address: String
  """Free-text state name — compared against a customer's own `state` to
  decide CGST+SGST (same state) vs IGST (different states)."""
  state: String
  """Registered legal name, city and pincode — required by the IRP for an
  e-invoice."""
  legalName: String
  city: String
  pincode: String
  """When true, generated invoices to GSTIN-holding customers are registered
  with the IRP (IRN + signed QR) before they are sent."""
  einvoiceEnabled: Boolean!
  bankAccountName: String
  bankName: String
  bankAccountNumber: String
  bankIfsc: String
  bankSwift: String
}

type EinvoiceSetup {
  """"gsp" or "nic"; null when no IRP credentials are saved."""
  provider: String
  hasCredentials: Boolean!
  """Seller details still missing for the IRP (empty when complete)."""
  missingSellerFields: [String!]!
}

input LineItemInput {
  description: String!
  """The person/role sub-line under the description, e.g. "Jane Doe -
  Kubernetes Engineer" on a services invoice."""
  note: String
  quantity: Float!
  unitPrice: Float!
  """e.g. "Days", "Hours", "Units" — printed next to the quantity."""
  unit: String
  hsnSac: String
  """Per-line GST %, not an invoice-level flat tax — the invoice's total tax
  is the sum of each line's own taxable value × its own gstRate, grouped by
  (hsnSac, gstRate) in the generated PDF's tax table."""
  gstRate: Float
}

input GenerateInvoiceInput {
  customerId: ID!
  invoiceNumber: String!
  invoiceDate: String!
  dueDate: String!
  notes: String
  """One of "classic" | "modern" | "minimal" | "sidebar" | "compact"."""
  template: String!
  """Buyer's purchase order number — printed on the invoice if given."""
  buyerOrderNo: String
  """E-invoice acknowledgement number — printed on the invoice if given."""
  ackNo: String
  lineItems: [LineItemInput!]!
}

# extractedFieldsJson / sourceMapJson: JSON.stringify of the OCR draft's
# extracted_fields / source_map (arbitrary shape from the OCR/LLM read) — kept
# as strings rather than adding a custom JSON scalar; the client JSON.parses
# them back into the same shape /api/ocr returns.
type ReviewQueueItem {
  id: ID!
  status: String!
  issues: [String!]!
  createdAt: String!
  filename: String
  direction: String
  counterpartyName: String
  extractedFieldsJson: String!
  sourceMapJson: String!
  fullText: String
}

type MlModelMetrics {
  rocAuc: Float
  accuracy: Float
  precision: Float
  recall: Float
  maeDays: Float
  r2: Float
}

type MlModel {
  status: String!
  method: String!
  modelVersion: String
  trainedAt: String
  nRows: Int
  featureCount: Int
  threshold: Float
  metrics: MlModelMetrics
}

type MlModelStatus {
  duplicate: MlModel!
  delay: MlModel!
}

# featurePsiJson / rollingMetricsJson / baselineMetricsJson: JSON.stringify of
# {feature: psi} / metric blobs — kept as strings rather than adding a custom
# JSON scalar (same convention as ReviewQueueItem's *Json fields above), since
# their shape varies per model (duplicate has no feature_psi, for instance).
type MlDriftReport {
  modelName: String!
  checkedAt: String!
  driftDetected: Boolean!
  featurePsiJson: String!
  rollingMetricsJson: String!
  baselineMetricsJson: String!
  notes: String
}

type MlRetrainEvent {
  id: ID!
  modelName: String!
  triggeredBy: String!
  startedAt: String!
  finishedAt: String
  status: String!
  oldVersion: String
  newVersion: String
  oldMetrics: MlModelMetrics
  newMetrics: MlModelMetrics
  error: String
}

type Mutation {
  approveInvoices(ids: [ID!]!): [Invoice!]!
  setApproval(id: ID!, status: ApprovalStatus!, note: String): Invoice!
  reviewDuplicate(invoiceId: ID!, status: String!): Invoice!
  recordPayment(invoiceId: ID!, paidAt: String!, amountPaid: Float!): Payment!
  createInvoice(input: InvoiceInput!): Invoice!
  importInvoices(rows: [InvoiceInput!]!): ImportResult!
  deleteInvoice(id: ID!): Boolean!
  createVendor(name: String!, taxId: String, paymentTermsDays: Int, email: String): Vendor!
  updateVendorEmail(id: ID!, email: String): Vendor!
  createCustomer(name: String!, taxId: String, email: String, paymentTermsDays: Int, creditLimit: Float): Customer!
  updateCustomerEmail(id: ID!, email: String): Customer!
  updateCustomerTaxDetails(
    id: ID!
    gstin: String
    address: String
    state: String
    legalName: String
    city: String
    pincode: String
  ): Customer!
  setCollectionStatus(id: ID!, status: CollectionStatus!): Invoice!
  updateCompanySettings(name: String!, aliases: [String!]!, digestEmails: [String!]): CompanySettings!
  saveCompanySignature(dataUrl: String!): CompanySettings!
  saveCompanyLogo(dataUrl: String!): CompanySettings!
  updateCompanyTaxDetails(
    gstin: String
    pan: String
    address: String
    state: String
    legalName: String
    city: String
    pincode: String
    bankAccountName: String
    bankName: String
    bankAccountNumber: String
    bankIfsc: String
    bankSwift: String
  ): CompanySettings!
  """Admin only. Turning it on requires a valid GSTIN and the full seller
  address (legal name, city, pincode) so the first e-invoice can't fail on
  missing company details."""
  setEinvoiceEnabled(enabled: Boolean!): CompanySettings!
  """Admin only. Stores this company's IRP credentials, encrypted at rest
  (never readable back through the API). `provider` is "nic" or "gsp";
  `configJson` is a JSON object of string fields (baseUrl, clientId, …)."""
  saveEinvoiceCredentials(provider: String!, configJson: String!): Boolean!
  """Creates a receivable invoice (with line items) from a template, renders
  it as a PDF stamped with the company's saved signature, and emails it to
  the customer — the invoice is created and tracked either way, even if the
  email itself fails to send."""
  generateAndSendInvoice(input: GenerateInvoiceInput!): Invoice!
  """Re-renders and re-sends a previously generated invoice using its saved
  template, line items and the company's current signature. Only valid for
  invoices generateAndSendInvoice created (i.e. `template` is set)."""
  resendInvoice(id: ID!): Boolean!
  """Re-attempts IRP registration for an invoice whose einvoiceStatus is
  `failed`, reusing the same invoice, and emails it once it has an IRN."""
  retryEinvoice(id: ID!): Invoice!
  setReviewQueueStatus(id: ID!, status: String!): ReviewQueueItem!
  triggerDriftCheck: [MlDriftReport!]!
  triggerModelRetrain(modelName: String!): MlRetrainEvent!
  deleteDemoRequest(id: ID!): Boolean!
}
