table:
  name: einvoice_credentials
  schema: public
# Secrets live here, so only the server-minted `einvoice_service` role has any
# access — no browser-facing role (finance_user / approver / company_admin) does.
insert_permissions:
  - role: einvoice_service
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - provider
        - config_encrypted
select_permissions:
  - role: einvoice_service
    permission:
      columns:
        - provider
        - config_encrypted
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
update_permissions:
  - role: einvoice_service
    permission:
      columns:
        - provider
        - config_encrypted
        - updated_at
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
