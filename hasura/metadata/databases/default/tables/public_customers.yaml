table:
  name: customers
  schema: public
array_relationships:
  - name: invoices
    using:
      foreign_key_constraint_on:
        column: customer_id
        table:
          name: invoices
          schema: public
insert_permissions:
  - role: finance_user
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - name
        - tax_id
        - payment_terms_days
        - email
        - credit_limit
  - role: company_admin
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - name
        - tax_id
        - payment_terms_days
        - email
        - credit_limit
update_permissions:
  - role: finance_user
    permission:
      columns:
        - email
        - gstin
        - address
        - state
        - legal_name
        - city
        - pincode
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
  - role: company_admin
    permission:
      columns:
        - email
        - gstin
        - address
        - state
        - legal_name
        - city
        - pincode
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
select_permissions:
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: notifier
    permission:
      columns:
        - id
        - name
        - email
      filter: {}
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: genai_writer
    # Needed for the `customer { name }` relationship under invoices in
    # _INVOICE_FULL — cross-tenant, same as genai_writer's invoices grant.
    permission:
      columns:
        - name
      filter: {}
  - role: ml_service
    # No customer columns are actually read — just needed to expose the
    # `customer { invoices {...} }` relationship traversal in ml/train.py's
    # payment-history query.
    permission:
      columns:
        - id
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
