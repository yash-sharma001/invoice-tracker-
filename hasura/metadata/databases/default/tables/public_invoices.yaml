table:
  name: invoices
  schema: public
object_relationships:
  - name: vendor
    using:
      foreign_key_constraint_on: vendor_id
  - name: customer
    using:
      foreign_key_constraint_on: customer_id
  - name: purchaseOrder
    using:
      foreign_key_constraint_on: po_id
array_relationships:
  - name: approvals
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: approvals
          schema: public
  - name: payments
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: payments
          schema: public
  - name: lineItems
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: invoice_line_items
          schema: public
insert_permissions:
  - role: finance_user
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_number
        - description
        - extracted_text
        - direction
        - vendor_id
        - customer_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - collection_status
        - payment_status
        - source
        - created_by
        - template
        - buyer_order_no
        - ack_no
        - place_of_supply
  - role: company_admin
    permission:
      check: {}
      set:
        company_id: X-Hasura-Company-Id
      columns:
        - invoice_number
        - description
        - extracted_text
        - direction
        - vendor_id
        - customer_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - collection_status
        - payment_status
        - source
        - created_by
        - template
        - buyer_order_no
        - ack_no
        - place_of_supply
select_permissions:
  - role: einvoice_service
    # The only role that can write IRP results (see update_permissions below).
    permission:
      columns:
        - id
        - company_id
        - irn
        - einvoice_status
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: payments_webhook
    permission:
      columns:
        - id
        - company_id
      filter: {}
  - role: finance_user
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: approver
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: company_admin
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      allow_aggregations: true
  - role: genai_readonly
    permission:
      columns: "*"
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: ml_service
    permission:
      columns:
        - id
        - invoice_number
        - amount
        - tax_amount
        - po_id
        - invoice_date
        - due_date
        - department
        - vendor_id
        - customer_id
        - payment_status
        - direction
        - company_id
        - created_at
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: ocr_service
    permission:
      columns:
        - id
        - invoice_number
        - invoice_date
        - created_at
        - amount
        - tax_amount
        - company_id
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: notifier
    # Cross-tenant by design — the daily overdue sweep runs across every
    # company, so this can't be company-scoped like the other roles. Narrowed
    # to only the columns the sweep actually reads to compensate.
    permission:
      columns:
        - id
        - company_id
        - invoice_number
        - due_date
        - amount
        - tax_amount
        - department
        - direction
        - payment_status
        - collection_status
        - last_reminder_on
        - reminder_count
      filter: {}
  - role: genai_writer
    # Cross-tenant like `notifier`, for the same structural reason: /embed's
    # per-invoice read and /embed/backfill's id sweep both run before the
    # invoice's own company_id is known (that's part of what they're reading).
    # Columns capped to exactly what services/genai-service/app/hasura.py's
    # _INVOICE_FULL query uses.
    permission:
      columns:
        - id
        - company_id
        - invoice_number
        - amount
        - tax_amount
        - department
        - invoice_date
        - due_date
        - approval_status
        - payment_status
        - description
        - extracted_text
      filter: {}
update_permissions:
  - role: finance_user
    permission:
      columns:
        - invoice_number
        - description
        - vendor_id
        - customer_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - collection_status
        - payment_status
        - source
        - created_by
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
  - role: company_admin
    permission:
      columns:
        - invoice_number
        - description
        - vendor_id
        - customer_id
        - po_id
        - invoice_date
        - due_date
        - amount
        - tax_amount
        - department
        - approval_status
        - collection_status
        - payment_status
        - source
        - created_by
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
  - role: approver
    permission:
      columns:
        - approval_status
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
  - role: notifier
    permission:
      columns:
        - payment_status
        - last_reminder_on
        - reminder_count
      filter: {}
      check: {}
  - role: payments_webhook
    permission:
      columns:
        - payment_status
      filter: {}
      check: {}
  - role: einvoice_service
    # Only this role can set an IRN. ack_no is included because for an
    # e-invoice it is the IRP's acknowledgement number, not a typed value.
    permission:
      columns:
        - irn
        - ack_no
        - ack_date
        - signed_qr
        - einvoice_status
        - einvoice_error
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
      check: {}
delete_permissions:
  - role: finance_user
    permission:
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
  - role: company_admin
    permission:
      filter: { company_id: { _eq: X-Hasura-Company-Id } }
event_triggers:
  - name: invoice_ml_score
    definition:
      enable_manual: true
      insert:
        columns: "*"
      update:
        columns:
          # delay-model features
          - amount
          - tax_amount
          - vendor_id
          - customer_id
          - direction
          - department
          - invoice_date
          - po_id
          # a payment-status change shifts the party's on-time rate -> ml-service
          # re-scores that party's other open invoices
          - payment_status
    retry_conf:
      num_retries: 3
      interval_sec: 15
      timeout_sec: 60
    webhook_from_env: ML_SERVICE_SCORE_URL
    headers:
      - name: x-service-source
        value: hasura-event-trigger
      - name: X-Internal-Token
        value_from_env: INTERNAL_SERVICE_TOKEN
  - name: invoice_embed
    definition:
      enable_manual: true
      insert:
        columns: "*"
      update:
        columns:
          - invoice_number
          - vendor_id
          - amount
          - tax_amount
          - department
          - invoice_date
          - due_date
          - approval_status
          - payment_status
    retry_conf:
      num_retries: 3
      interval_sec: 30
      timeout_sec: 60
    webhook: "{{GENAI_SERVICE_URL}}/embed"
    headers:
      - name: x-service-source
        value: hasura-event-trigger
      - name: X-Internal-Token
        value_from_env: INTERNAL_SERVICE_TOKEN
